version: "3.9"

# ╔══════════════════════════════════════════════════════════════╗
# ║         Marzban Panel — Docker Compose                       ║
# ║         Kullanım: docker compose up -d                       ║
# ╚══════════════════════════════════════════════════════════════╝
#
# NOT: Xray-core host ağını kullandığından (port yönetimi için)
#      API sunucusunun host network'e erişimi gerekiyor.

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: marzban-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marzban
      POSTGRES_USER: marzban
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marzban_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marzban"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marzban

  # ── API Backend ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: marzban-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marzban:${DB_PASSWORD:-marzban_secret_change_me}@postgres:5432/marzban
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRE: 24h
      PORT: 8080
      NODE_ENV: production
      XRAY_BIN: /usr/local/bin/xray
      XRAY_CONFIG: /etc/xray/config.json
      XRAY_API_PORT: "62050"
      XRAY_LOG_LEVEL: warning
      XRAY_ACCESS_LOG: /var/log/xray/access.log
      XRAY_ERROR_LOG: /var/log/xray/error.log
      XRAY_CERT_FILE: /etc/ssl/xray/cert.pem
      XRAY_KEY_FILE: /etc/ssl/xray/key.pem
      XRAY_WS_PATH: ${XRAY_WS_PATH:-/ws}
      XRAY_SS_MASTER_PASS: ${XRAY_SS_MASTER_PASS:-masterpassword12345678}
    volumes:
      - xray_config:/etc/xray
      - xray_logs:/var/log/xray
      - xray_certs:/etc/ssl/xray
      - xray_bin:/usr/local/bin
    ports:
      - "8080:8080"
    networks:
      - marzban

  # ── Frontend Panel ──────────────────────────────────────────
  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    container_name: marzban-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - marzban

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: marzban-nginx
    restart: unless-stopped
    depends_on:
      - api
      - panel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - xray_certs:/etc/ssl/xray:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - marzban

  # ── Certbot (SSL) ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: marzban-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - ssl
    command: >
      certonly --webroot
      -w /var/www/certbot
      -d ${DOMAIN:-yourdomain.com}
      --email ${SSL_EMAIL:-admin@yourdomain.com}
      --agree-tos --non-interactive

volumes:
  postgres_data:
    name: marzban_postgres_data
  xray_config:
    name: marzban_xray_config
  xray_logs:
    name: marzban_xray_logs
  xray_certs:
    name: marzban_xray_certs
  xray_bin:
    name: marzban_xray_bin
  certbot_certs:
    name: marzban_certbot_certs
  certbot_www:
    name: marzban_certbot_www

networks:
  marzban:
    name: marzban_network
    driver: bridge
