name: Build & Release Professional X Panel

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: |
          cd artifacts/marzban-dashboard
          NODE_ENV=production BASE_PATH=/ pnpm build

      - name: Package dist
        run: |
          tar -czf professional-x-panel.tar.gz \
            -C artifacts/marzban-dashboard/dist/public .
          echo "SIZE=$(du -sh professional-x-panel.tar.gz | cut -f1)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: professional-x-panel
          path: professional-x-panel.tar.gz
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: professional-x-panel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: professional-x-panel.tar.gz
          generate_release_notes: true
          body: |
            ## Professional X Panel — ${{ github.ref_name }}

            ### Kurulum (tek komut):
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/install.sh)
            ```

            ### Manuel kurulum:
            1. `professional-x-panel.tar.gz` dosyasını indir
            2. Sunucuna yükle
            3. `deploy/install.sh` scriptini çalıştır

            ---
            **Temalar:** Marvel X • Ninja X • Kombat X  
            **Özellikler:** Cihaz & Konum Takibi, Animasyonlu arka planlar
